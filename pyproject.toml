[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corrosion-plot-digitizer"
version = "0.1.0"
description = "Evidence-first digitization of pitting-potential plots"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.0",
]

[project.scripts]
corrosion-plot-digitizer = "corrosion_plot_digitizer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/corrosion_plot_digitizer"]

